<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | 雲の上の水彩画</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: linear-gradient(180deg, #bfe0f5 0%, #dff0fa 30%, #fdf6f0 65%, #ffffff 100%);
      background-attachment: fixed;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      color: #4a5a6a;
      overflow-x: hidden;
    }

    /* 背景の雲とにじみ（固定） */
    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .cloud {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      filter: blur(28px);
      opacity: .7;
      animation: drift 45s ease-in-out infinite alternate;
    }
    .c1 { width: 420px; height: 130px; top: 6%; left: -6%; }
    .c2 { width: 520px; height: 160px; top: 60%; right: -8%; animation-duration: 58s; }
    .c3 { width: 360px; height: 110px; bottom: 4%; left: 8%; animation-duration: 50s; opacity: .55; }
    .wash { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .3; }
    .w1 { width: 300px; height: 300px; background: #f6c1d6; top: 15%; right: 8%; }
    .w2 { width: 260px; height: 260px; background: #c9b8ee; bottom: 15%; left: 5%; }
    @keyframes drift { from { transform: translateX(-40px); } to { transform: translateX(60px); } }

    header, main, footer { position: relative; z-index: 1; }
    header { text-align: center; padding: 50px 20px 0; }
    header .site { font-size: 22px; letter-spacing: .25em; color: #5d7a96; text-decoration: none; }
    nav { margin-top: 18px; }
    nav a { color: #5d7a96; padding: 6px 4px; border-bottom: 1px solid transparent; transition: border-color .3s; }
    nav a:hover, nav a.current { border-bottom-color: #5d7a96; }

    .page-title { color: #5d7a96; letter-spacing: .25em; text-shadow: 0 2px 20px rgba(255,255,255,.9); }

    /* 作品カード */
    .gallery { max-width: 1000px; margin: 0 auto; padding-bottom: 40px; }
    .card {
      background: rgba(255, 255, 255, .6);
      backdrop-filter: blur(6px);
      border-radius: 12px;
      padding: 12px 12px 6px;
      box-shadow: 0 10px 30px rgba(120, 160, 200, .22);
      transition: transform .4s, box-shadow .4s;
    }
    .card:hover { transform: translateY(-6px); box-shadow: 0 16px 36px rgba(120, 160, 200, .32); }
    .card img { display: block; }
    .card p { color: #5d7a96; letter-spacing: .1em; margin: 12px 0 8px; }

    footer { text-align: center; padding: 30px 0 40px; font-size: 12px; color: #8fa5b8; letter-spacing: .15em; }

    @media (prefers-reduced-motion: reduce) { .cloud { animation: none; } .card { transition: none; } }
  </style>
</head>
<body>

<div class="bg">
  <div class="wash w1"></div>
  <div class="wash w2"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
</div>

<header>
  <a class="site" href="index.html">雲の上の水彩画</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="gallery.html" class="current">Gallery</a>
    <a href="blog.html">Blog</a>
    <a href="about.html">About</a>
  </nav>
</header>

<main>
  <h1 class="page-title">Gallery</h1>

  <div class="gallery">

    <div class="card">
      <img src="illust5.jpg" alt="作品1">
      <p>黄色の杯</p>
    </div>

    <div class="card">
      <img src="illust4.jpg" alt="作品2">
      <p>不気味なもの</p>
    </div>

    <div class="card">
      <img src="pic1.jpg" alt="瓶">
      <p>瓶</p>
    </div>

    <div class="card">
      <img src="アッポー.jpg" alt="林檎">
      <p>最初の水彩</p>
    </div>

  </div>
</main>

<footer>&copy; 雲の上の水彩画</footer>

</body>
</html>
